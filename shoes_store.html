<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoes Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style_shoesStore.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-produk fw-bold text-decoration-none" href="#"
          >SHOES.</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-menu d-block p-2 text-decoration-none" href="#"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-menu d-block p-2 text-decoration-none" href="#"
                >Products</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-menu d-block p-2 text-decoration-none" href="#"
                >About</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 80vh"
    >
      <div class="card product-card p-3" id="productCard">
        <div class="row g-0 align-items-center">
          <div class="col-md-5 d-flex justify-content-center align-items-center">
            <img
              src="nike air runner.png"
              class="img-fluid gambar-produk"
              alt="Air Runner"
            />
          </div>
          <div class="col-md-7">
            <div class="card-body">
              <p class="category-text">RUNNING SHOES</p>
              <h3 class="card-title fw-bold teks-utama">Air Runner</h3>
              <p class="deskripsi">
                Sepatu ringan dan bantalan untuk digunakan saat berolahraga
                maupun aktivitas sehari-hari
              </p>
              <h4 class="fw-bold teks-utama mb-4">Rp 899.000</h4>
              <p class="mb-2 teks-utama" style="font-size: 14px">Pilih warna</p>
              <div class="d-flex mb-4">
                <button
                  class="color-btn btn-black"
                  onclick="changeColor('black')"
                ></button>
                <button
                  class="color-btn btn-blue"
                  onclick="changeColor('blue')"
                ></button>
                <button
                  class="color-btn btn-cream"
                  onclick="changeColor('cream')"
                ></button>
              </div>
              <button class="btn btn-add-cart w-100">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function changeColor(color) {
        const card = document.getElementById("productCard");
        if (color === "black") {
          card.style.backgroundColor = "#DDDDDD";
        } else if (color === "blue") {
          card.style.backgroundColor = "#CFE2FF";
        } else if (color === "cream") {
          card.style.backgroundColor = "#F5E6CC";
        }
      }
    </script>
  </body>
</html>
